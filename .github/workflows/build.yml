name: Build Keycloak image with soccerproject theme

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'themes/**'
      - '.github/workflows/build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: reesing322/soccerproject-keycloak-theme

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:26.7.1-theme-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:26.7.1-theme-${{ github.sha }}
