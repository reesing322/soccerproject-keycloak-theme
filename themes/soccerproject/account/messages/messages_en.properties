# SoccerProject.com — account theme, English
#
# The account console (keycloak.v3) labels the user-profile username attribute
# through its displayName, ${username} in the realm config. Keycloak's own
# account bundle calls that "Username"; the game calls it the manager name
# (theme#16). managerName / managerUsername cover a realm whose user profile
# points displayName at those keys instead, as the login theme's bundle does.
# Keep en, nl and cs key for key in step.
username=Manager name
usernamePlaceholder=Manager name or email
managerName=Manager name
managerUsername=Manager name
