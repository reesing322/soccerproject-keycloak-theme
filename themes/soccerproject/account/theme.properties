## SoccerProject.com — Keycloak "account" theme  (Account Console v3 / React)
## TARGET: Keycloak 26.7.1
##
## Account-console parent themes are version-specific. On KC 26 the console is
## the React + PatternFly 5 app and the ONLY valid parent is keycloak.v3:
##   - parent=keycloak        → v1 FreeMarker console, removed → theme DROPPED
##                              from the Account dropdown
##   - parent=keycloak.v2     → removed in KC 26 → also fails
##   - parent=keycloak.v3     → correct for KC 24/25/26.  ✓
##
## You inherit keycloak.v3's index.ftl (it bootstraps the React app and injects
## any `styles=` listed here). Branding is CSS-only, by overriding PatternFly
## variables — see resources/css/sp-account.v3.css.

parent=keycloak.v3

# Browser tab / console header title.
title=SoccerProject.com

# Injected into the account console <head> via the inherited index.ftl.
# Versioned filename for cache-busting — bump v3 → v4 (rename + update here)
# when you change the CSS and need caches to drop the old copy.
styles=css/sp-account.v3.css

# Masthead logo. If it 404s, see INTEGRATION.md §5b for the absolute-path fallback.
logo=img/puppet-white.png

# Kept in step with login/theme.properties, so a manager who picked a language
# on the sign-in screen finds the account console in it too. See the note there
# for why this is en,nl for now and how to re-enable the rest.
locales=en,nl
