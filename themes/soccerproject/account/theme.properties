## SoccerProject.com — Keycloak "account" theme  (Account Console v3 / React)
## TARGET: Keycloak 26.7.1
##
## Account-console parent themes are version-specific. On KC 26 the console is
## the React + PatternFly 5 app and the ONLY valid parent is keycloak.v3:
##   - parent=keycloak        → v1 FreeMarker console, removed → theme DROPPED
##                              from the Account dropdown
##   - parent=keycloak.v2     → removed in KC 26 → also fails
##   - parent=keycloak.v3     → correct for KC 24/25/26.  ✓
##
## You inherit keycloak.v3's index.ftl (it bootstraps the React app and injects
## any `styles=` listed here). Branding is CSS-only, by overriding PatternFly
## variables — see resources/css/sp-account.v3.css.

parent=keycloak.v3

# Browser tab / console header title.
title=SoccerProject.com

# Injected into the account console <head> via the inherited index.ftl.
# Versioned filename for cache-busting — bump v3 → v4 (rename + update here)
# when you change the CSS and need caches to drop the old copy.
styles=css/sp-account.v3.css

# Masthead logo. If it 404s, see INTEGRATION.md §5b for the absolute-path fallback.
logo=img/puppet-white.png

# Browser tab icon.
#
# Without this the console falls through to Keycloak's own keyhole: the
# inherited keycloak.v3/account/index.ftl ends its icon block with
#   <link rel="icon" type="${properties.favIconType!'image/svg+xml'}"
#         href="${resourceUrl}${properties.favIcon!'/favicon.svg'}">
# and that default resolves to keycloak.v3/account/resources/favicon.svg. So a
# manager who signed in under our mark and then opened Account got a third tab
# carrying someone else's logo between two of ours -- the same mismatch as
# soccerproject-frontend#1274, one surface over.
#
# `favicons.<key>` is the KC 26 mechanism (org.keycloak.theme.ThemeResourcesParser);
# the older `favIcon`/`favIconType` pair still works, but the parser reads it in
# a method called parseLegacyFavicon and only when no `favicons.*` key is set.
# Recognised sub-keys are `rel`, `type`, `media` and `order`.
#
# One file, not the login theme's four. `favicons.*` has no `sizes` sub-key and
# renderFavicons does not emit the attribute, so listing a 16 and a 32 here
# would hand the browser two candidates it cannot tell apart. The .ico carries
# 16/32/48 internally as PNGs -- the same bytes those separate files would have
# -- and the browser picks the right one from inside it. There is no
# apple-touch-icon either: this is a page you open from a desktop session to
# change a password, not one anyone pins to a home screen.
#
# The `?v=` is the cache buster -- Keycloak sends theme resources with a 30-day
# cache header and does not change the URL when a file's content does. Keep it
# in step with login/template.ftl. See "Cache busting" in the README.
favicons.ico=img/favicon.ico?v=6
favicons.ico.type=image/x-icon

# Kept in step with login/theme.properties, so a manager who picked a language
# on the sign-in screen finds the account console in it too. See the note there
# for why this is en,nl for now and how to re-enable the rest.
locales=en,nl
