# SoccerProject.com — email theme, Čeština
#
# Kept key for key in step with messages_en.properties: a key missing here
# falls back to the realm’s default locale and then English, which gives a
# mixed-language mail (Czech subject, English or Dutch HTML body). Addresses the
# reader as "ty", like the login theme. Every value goes through
# java.text.MessageFormat, so no ASCII apostrophe: use ’.

# Subjects
emailVerificationSubject=Potvrď svůj e-mail pro SoccerProject.com
passwordResetSubject=Zvol si heslo pro SoccerProject.com

# HTML layout (html/template.ftl): header wordmark and footer. Brand, legal
# entity and privacy label match the backend mail’s email.layout.* catalog
# keys (theme#14), so the two kinds of mail carry the same chrome.
spEmailBrand=SoccerProject
spEmailFootReason=Tento e-mail ti přišel, protože někdo požádal o akci u tvého účtu SoccerProject.com.
spEmailLegalEntity=CymIT BV
spEmailPrivacyLink=Zásady ochrany osobních údajů

# Both HTML mails. {0} is Keycloak’s linkExpirationFormatter output, already
# Czech from Keycloak’s own linkExpirationFormatter.timePeriodUnit.* keys. Those
# are nominative ("1 hodina", "12 hodin", "1 den"), so the sentence takes {0}
# after a colon: "vyprší za 1 hodina" would need the accusative.
spLinkExpires=Platnost odkazu: {0}.

# html/email-verification.ftl
spVerifyHeading=Potvrď svůj e-mail
spVerifyLead=Vítej na SoccerProject.com! Potvrzením e-mailové adresy si aktivuješ účet. Hned potom si zvolíš heslo a můžeš se ujmout vedení svého klubu.
spVerifyButton=Potvrdit e-mail
spVerifyIgnore=Pokud účet na SoccerProject.com není tvůj, můžeš tento e-mail klidně ignorovat.

# html/password-reset.ftl
spResetHeading=Zvol si heslo
spResetLead=Dostali jsme žádost o nastavení hesla k tvému účtu SoccerProject.com. Klikni níže a zvol si ho.
spResetButton=Zvolit heslo
spResetNoPassword=Registrace není dokončená, a proto ještě nemáš heslo? I tak tento odkaz funguje. Pokud adresa ještě není potvrzená, pošleme ti nejdřív ještě jeden e-mail k jejímu potvrzení. Přes jeho odkaz si zvolíš heslo.
spResetIgnore=Žádost nepochází od tebe? Tento e-mail ignoruj a tvé heslo zůstane beze změny.

# Plain-text parts (Keycloak’s own text templates read these keys). Keycloak’s
# Czech is formal ("vy"); these say "ty" and match the HTML part. {0} link,
# {3} expiry as above.
emailVerificationBody=Vítej na SoccerProject.com! Potvrzením e-mailové adresy si aktivuješ účet. Hned potom si zvolíš heslo a můžeš se ujmout vedení svého klubu. Potvrď ji tímto odkazem:\n\n{0}\n\nPlatnost odkazu: {3}.\n\nPokud účet na SoccerProject.com není tvůj, můžeš tento e-mail klidně ignorovat.
passwordResetBody=Dostali jsme žádost o nastavení hesla k tvému účtu SoccerProject.com. Otevři tento odkaz a zvol si ho:\n\n{0}\n\nPlatnost odkazu: {3}.\n\nRegistrace není dokončená, a proto ještě nemáš heslo? I tak tento odkaz funguje. Pokud adresa ještě není potvrzená, pošleme ti nejdřív ještě jeden e-mail k jejímu potvrzení. Přes jeho odkaz si zvolíš heslo.\n\nŽádost nepochází od tebe? Tento e-mail ignoruj a tvé heslo zůstane beze změny.
