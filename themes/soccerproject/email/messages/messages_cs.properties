# SoccerProject.com — email theme, Čeština
#
# Kept key for key in step with messages_en.properties: a key missing here
# falls back to the realm’s default locale and then English, which gives a
# mixed-language mail (Czech subject, English or Dutch HTML body). Addresses the
# reader as "ty", like the login theme. Every value goes through
# java.text.MessageFormat, so no ASCII apostrophe: use ’.

# Subjects
emailVerificationSubject=Potvrď svůj e-mail pro SoccerProject.com
passwordResetSubject=Obnovení hesla pro SoccerProject.com

# HTML layout (html/template.ftl): footer
spEmailFootReason=Tento e-mail ti přišel, protože někdo požádal o akci u tvého účtu SoccerProject.com.
spEmailFootLead=Od roku 2004 tvůj oblíbený fotbalový manažer!

# Both HTML mails. {0} is Keycloak’s linkExpirationFormatter output, already
# Czech from Keycloak’s own linkExpirationFormatter.timePeriodUnit.* keys. Those
# are nominative ("1 hodina", "24 hodin"), so the sentence takes {0} after a
# colon: "vyprší za 1 hodina" would need the accusative.
spLinkExpires=Platnost odkazu: {0}.

# html/email-verification.ftl
spVerifyHeading=Potvrď svůj e-mail
spVerifyLead=Vítej na SoccerProject.com! Potvrď svou e-mailovou adresu, aktivuj si účet a převezmi vedení svého klubu.
spVerifyButton=Potvrdit e-mail
spVerifyIgnore=Pokud účet na SoccerProject.com není tvůj, můžeš tento e-mail klidně ignorovat.

# html/password-reset.ftl
spResetHeading=Obnov si heslo
spResetLead=Dostali jsme žádost o obnovení hesla k tvému účtu SoccerProject.com. Klikni níže a zvol si nové.
spResetButton=Obnovit heslo
spResetIgnore=Pokud o to nežádáš ty, tento e-mail ignoruj a tvé heslo zůstane beze změny.

# Plain-text parts (Keycloak’s own text templates read these keys). Keycloak’s
# Czech is formal ("vy"); these say "ty" and match the HTML part. {0} link,
# {3} expiry as above.
emailVerificationBody=Vítej na SoccerProject.com! Potvrď svou e-mailovou adresu, aktivuj si účet a převezmi vedení svého klubu:\n\n{0}\n\nPlatnost odkazu: {3}.\n\nPokud účet na SoccerProject.com není tvůj, můžeš tento e-mail klidně ignorovat.
passwordResetBody=Dostali jsme žádost o obnovení hesla k tvému účtu SoccerProject.com. Otevři tento odkaz a zvol si nové:\n\n{0}\n\nPlatnost odkazu: {3}.\n\nPokud o to nežádáš ty, tento e-mail ignoruj a tvé heslo zůstane beze změny.
