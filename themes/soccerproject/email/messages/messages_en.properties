# SoccerProject.com — email theme, English
#
# Kept key for key in step with messages_nl.properties: a key missing from one
# language falls back to English, which is the mixed-language mail theme#20
# fixes. Every value goes through java.text.MessageFormat, so no ASCII
# apostrophe: use ’.

# Subjects
emailVerificationSubject=Confirm your SoccerProject.com email
passwordResetSubject=Reset your SoccerProject.com password

# HTML layout (html/template.ftl): footer
spEmailFootReason=You received this email because an action was requested on your SoccerProject.com account.
spEmailFootLead=Since 2004 your favourite football manager!

# Both HTML mails. {0} is Keycloak’s linkExpirationFormatter output, already in
# the mail’s language ("5 minutes", "1 hour") from Keycloak’s own
# linkExpirationFormatter.timePeriodUnit.* keys.
spLinkExpires=This link expires in {0}. If the button doesn’t work, copy and paste this URL into your browser:

# html/email-verification.ftl
spVerifyHeading=Confirm your email
spVerifyLead=Welcome to SoccerProject.com! Confirm your email address to activate your account and take charge of your club.
spVerifyButton=Verify email
spVerifyIgnore=If you didn’t create a SoccerProject.com account, you can safely ignore this email.

# html/password-reset.ftl
spResetHeading=Reset your password
spResetLead=We received a request to reset the password for your SoccerProject.com account. Click below to choose a new one.
spResetButton=Reset password
spResetIgnore=Didn’t request this? Ignore this email and your password stays unchanged.

# Plain-text parts. The text templates are Keycloak’s own (parent=keycloak) and
# read these keys; without them the text part of a mail tells a different story
# from its HTML part. {0} link, {3} expiry as above.
emailVerificationBody=Welcome to SoccerProject.com! Confirm your email address to activate your account and take charge of your club:\n\n{0}\n\nThis link expires in {3}.\n\nIf you didn’t create a SoccerProject.com account, you can safely ignore this email.
passwordResetBody=We received a request to reset the password for your SoccerProject.com account. Open this link to choose a new one:\n\n{0}\n\nThis link expires in {3}.\n\nDidn’t request this? Ignore this email and your password stays unchanged.
