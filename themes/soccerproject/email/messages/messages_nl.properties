orgInviteBodyHtml=<p>Je bent uitgenodigd om lid te worden van de organisatie {3}. Open de link hieronder om lid te worden.</p><p><a href="{0}">Lid worden van {3}</a></p><p>Deze link verloopt over {4}.</p><p>Wil je geen lid worden? Negeer dan deze e-mail.</p>
