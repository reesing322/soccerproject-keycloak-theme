# SoccerProject.com — email theme, Nederlands
#
# Kept key for key in step with messages_en.properties: a key missing here
# falls back to English, which is the mixed-language mail theme#20 fixes ("This
# link expires in 5 minuten"). Addresses the reader as "je", like the game and
# the login theme. Every value goes through java.text.MessageFormat, so no
# ASCII apostrophe: use ’.

# Subjects
emailVerificationSubject=Bevestig je e-mailadres voor SoccerProject.com
passwordResetSubject=Stel een nieuw wachtwoord in voor SoccerProject.com

# HTML layout (html/template.ftl): header wordmark and footer. Brand, legal
# entity and privacy label match the backend mail’s email.layout.* catalog
# keys (theme#14), so the two kinds of mail carry the same chrome.
spEmailBrand=SoccerProject
spEmailFootReason=Je krijgt deze e-mail omdat er een actie is aangevraagd voor je SoccerProject.com-account.
spEmailLegalEntity=CymIT BV
spEmailPrivacyLink=Privacybeleid

# Both HTML mails. {0} is Keycloak’s linkExpirationFormatter output, already
# Dutch ("5 minuten", "1 uur") from Keycloak’s own
# linkExpirationFormatter.timePeriodUnit.* keys in its Dutch email bundle.
spLinkExpires=Deze link verloopt over {0}.

# Keycloak 26.7.1’s Dutch unit for hours is "{0} uur", but the formatter already
# puts the number in front of the unit, so a 12-hour link read "verloopt over
# 12 12 uur" (theme#14). The other Dutch units and every en/cs unit are bare.
linkExpirationFormatter.timePeriodUnit.hours=uur

# html/email-verification.ftl
spVerifyHeading=Bevestig je e-mailadres
spVerifyLead=Welkom bij SoccerProject.com! Bevestig je e-mailadres om je account te activeren en je club te leiden.
spVerifyButton=E-mailadres bevestigen
spVerifyIgnore=Heb je geen SoccerProject.com-account aangemaakt? Dan kun je deze e-mail gewoon negeren.

# html/password-reset.ftl
spResetHeading=Nieuw wachtwoord instellen
spResetLead=We kregen een verzoek om het wachtwoord van je SoccerProject.com-account opnieuw in te stellen. Klik hieronder om een nieuw wachtwoord te kiezen.
spResetButton=Nieuw wachtwoord kiezen
spResetIgnore=Heb je dit niet aangevraagd? Negeer dan deze e-mail; je wachtwoord blijft ongewijzigd.

# Plain-text parts (Keycloak’s own text templates read these keys). Keycloak’s
# Dutch says "u"; these say "je" and match the HTML part. {0} link, {3} expiry.
emailVerificationBody=Welkom bij SoccerProject.com! Bevestig je e-mailadres om je account te activeren en je club te leiden:\n\n{0}\n\nDeze link verloopt over {3}.\n\nHeb je geen SoccerProject.com-account aangemaakt? Dan kun je deze e-mail gewoon negeren.
passwordResetBody=We kregen een verzoek om het wachtwoord van je SoccerProject.com-account opnieuw in te stellen. Open deze link om een nieuw wachtwoord te kiezen:\n\n{0}\n\nDeze link verloopt over {3}.\n\nHeb je dit niet aangevraagd? Negeer dan deze e-mail; je wachtwoord blijft ongewijzigd.
