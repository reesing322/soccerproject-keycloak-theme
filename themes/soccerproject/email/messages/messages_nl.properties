# SoccerProject.com — email theme, Nederlands
#
# Kept key for key in step with messages_en.properties: a key missing here
# falls back to English, which is the mixed-language mail theme#20 fixes ("This
# link expires in 5 minuten"). Addresses the reader as "je", like the game and
# the login theme. Every value goes through java.text.MessageFormat, so no
# ASCII apostrophe: use ’.

# Subjects
emailVerificationSubject=Bevestig je e-mailadres voor SoccerProject.com
passwordResetSubject=Kies je wachtwoord voor SoccerProject.com

# HTML layout (html/template.ftl): header wordmark and footer. Brand, legal
# entity and privacy label match the backend mail’s email.layout.* catalog
# keys (theme#14), so the two kinds of mail carry the same chrome.
spEmailBrand=SoccerProject
spEmailFootReason=Je krijgt deze e-mail omdat er een actie is aangevraagd voor je SoccerProject.com-account.
spEmailLegalEntity=CymIT BV
spEmailPrivacyLink=Privacybeleid

# Both HTML mails. {0} is Keycloak’s linkExpirationFormatter output, already
# Dutch ("5 minuten", "1 uur") from Keycloak’s own
# linkExpirationFormatter.timePeriodUnit.* keys in its Dutch email bundle.
spLinkExpires=Deze link verloopt over {0}.

# Keycloak 26.7.1’s Dutch unit for hours is "{0} uur", but the formatter already
# puts the number in front of the unit, so a 12-hour link read "verloopt over
# 12 12 uur" (theme#14). The other Dutch units and every en/cs unit are bare.
linkExpirationFormatter.timePeriodUnit.hours=uur

# html/email-verification.ftl
spVerifyHeading=Bevestig je e-mailadres
spVerifyLead=Welkom bij SoccerProject.com! Bevestig je e-mailadres om je account te activeren. Meteen daarna kies je je wachtwoord en leid je je club.
spVerifyButton=E-mailadres bevestigen
spVerifyIgnore=Heb je geen SoccerProject.com-account aangemaakt? Dan kun je deze e-mail gewoon negeren.

# html/password-reset.ftl
spResetHeading=Kies je wachtwoord
spResetLead=We kregen een verzoek om het wachtwoord van je SoccerProject.com-account in te stellen. Klik hieronder om er een te kiezen.
spResetButton=Wachtwoord kiezen
spResetNoPassword=Heb je je aanmelding nooit afgerond en heb je dus nog geen wachtwoord? Ook dan werkt deze link. Is je adres nog niet bevestigd? Dan sturen we eerst nog één mail om het te bevestigen. Via die link kies je je wachtwoord.
spResetIgnore=Heb je dit niet aangevraagd? Negeer dan deze e-mail; je wachtwoord blijft ongewijzigd.

# Plain-text parts (Keycloak’s own text templates read these keys). Keycloak’s
# Dutch says "u"; these say "je" and match the HTML part. {0} link, {3} expiry.
emailVerificationBody=Welkom bij SoccerProject.com! Bevestig je e-mailadres om je account te activeren. Meteen daarna kies je je wachtwoord en leid je je club:\n\n{0}\n\nDeze link verloopt over {3}.\n\nHeb je geen SoccerProject.com-account aangemaakt? Dan kun je deze e-mail gewoon negeren.
passwordResetBody=We kregen een verzoek om het wachtwoord van je SoccerProject.com-account in te stellen. Open deze link om er een te kiezen:\n\n{0}\n\nDeze link verloopt over {3}.\n\nHeb je je aanmelding nooit afgerond en heb je dus nog geen wachtwoord? Ook dan werkt deze link. Is je adres nog niet bevestigd? Dan sturen we eerst nog één mail om het te bevestigen. Via die link kies je je wachtwoord.\n\nHeb je dit niet aangevraagd? Negeer dan deze e-mail; je wachtwoord blijft ongewijzigd.

# Keycloak’s own Dutch mails, re-worded from “u/uw” to “je” (theme#34). Each
# keeps the {n} arguments of the Keycloak 26.7.1 key it replaces. Not here:
# emailVerificationBody and passwordResetBody (ours, above) and their *Html
# variants (unused: html/email-verification.ftl and password-reset.ftl replace
# them). tools/check_email_messages.py fails on a formal “u” in this file and,
# given Keycloak’s themes jar, on a formal base key this file does not override.

# execute-actions (admin or app asks the player to update the account)
executeActionsSubject=Je account bijwerken
executeActionsBody=Er is gevraagd om je {2}-account bij te werken met de volgende acties: {3}. Open de link hieronder om te beginnen.\n\n{0}\n\nDeze link verloopt over {4}.\n\nWist je hier niets van? Negeer dan deze e-mail; je account blijft ongewijzigd.
executeActionsBodyHtml=<p>Er is gevraagd om je {2}-account bij te werken met de volgende acties: {3}. Open de link hieronder om te beginnen.</p><p><a href="{0}">Account bijwerken</a></p><p>Deze link verloopt over {4}.</p><p>Wist je hier niets van? Negeer dan deze e-mail; je account blijft ongewijzigd.</p>

# e-mailadres wijzigen
emailUpdateConfirmationBody=Open de link hieronder om het e-mailadres van je {2}-account te wijzigen naar {1}.\n\n{0}\n\nDeze link verloopt over {3}.\n\nWil je dit toch niet? Negeer dan deze e-mail.
emailUpdateConfirmationBodyHtml=<p>Open de link hieronder om het e-mailadres van je {2}-account te wijzigen naar {1}.</p><p><a href="{0}">{0}</a></p><p>Deze link verloopt over {3}.</p><p>Wil je dit toch niet? Negeer dan deze e-mail.</p>

# verificatie met een code
emailVerificationBodyCode=Bevestig je e-mailadres met deze code:\n\n{0}
emailVerificationBodyCodeHtml=<p>Bevestig je e-mailadres met deze code:</p><p><b>{0}</b></p>

# account koppelen aan een externe login
identityProviderLinkBody=Iemand wil je {1}-account koppelen aan het {0}-account van gebruiker {2}. Was jij dit? Open dan de link hieronder om de accounts te koppelen.\n\n{3}\n\nDeze link verloopt over {5}.\n\nWas jij dit niet, of wil je de accounts niet koppelen? Negeer dan deze e-mail. Koppel je ze wel, dan kun je bij {1} inloggen via {0}.
identityProviderLinkBodyHtml=<p>Iemand wil je <b>{1}</b>-account koppelen aan het <b>{0}</b>-account van gebruiker {2}. Was jij dit? Open dan de link hieronder om de accounts te koppelen.</p><p><a href="{3}">Accounts koppelen</a></p><p>Deze link verloopt over {5}.</p><p>Was jij dit niet, of wil je de accounts niet koppelen? Negeer dan deze e-mail. Koppel je ze wel, dan kun je bij {1} inloggen via {0}.</p>

