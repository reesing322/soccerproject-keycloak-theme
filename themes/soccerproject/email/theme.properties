## SoccerProject.com — Keycloak "email" theme
#
# Restyles all HTML emails (verification, password reset, execute-actions,
# org invite, etc.) by overriding html/template.ftl — every base HTML email
# routes through its emailLayout macro, so one override re-skins them all.
# Plain-text bodies fall back to the base theme (parent=keycloak).

parent=keycloak

# Kept in step with login/theme.properties. Two gaps, upstream's rather than
# ours: Keycloak 26.7.1 ships no `ko` or `lv` email bundle
# (themes/src/main/resources-community/theme/base/email/messages), so Korean and
# Latvian mails fall back to English until it does.
locales=en,nl,fr,de,es,it,pt,pt-BR,ro,cs,sk,sl,pl,hu,hr,el,no,sv,da,fi,lt,lv,tr,uk,ru,ca,id,ja,ko,zh-CN
