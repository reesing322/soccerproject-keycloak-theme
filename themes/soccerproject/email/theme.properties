## SoccerProject.com — Keycloak "email" theme
#
# Restyles all HTML emails (verification, password reset, execute-actions,
# org invite, etc.) by overriding html/template.ftl — every base HTML email
# routes through its emailLayout macro, so one override re-skins them all.
# Plain-text bodies fall back to the base theme (parent=keycloak).

parent=keycloak

# Kept in step with login/theme.properties. See the note there for why this is
# en,nl for now and how to re-enable the rest.
locales=en,nl
