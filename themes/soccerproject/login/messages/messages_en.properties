# SoccerProject login theme — English overrides.
# Everything not listed here falls back to the parent (keycloak.v2 -> base),
# so new Keycloak releases keep shipping their own translations.

# Brand lock-up in the login header. Markup passes the Keycloak HTML sanitizer
# (div/span plus class are on its allow list) and is styled by soccerproject.css.
loginTitleHtml=<div class="kc-logo-text"><span>SoccerProject<span class="kc-brand-tld">.com</span></span></div>
loginTitle=SoccerProject.com

loginAccountTitle=Sign in to your account
doLogIn=Sign in
doRegister=Create account
registerTitle=Create your manager account
registerWithTitle=Create your manager account with {0}

noAccount=New to SoccerProject?
doForgotPassword=Forgot password?
emailForgotTitle=Forgot your password?
emailInstruction=Enter your username or email address and we will send you instructions for setting a new password.
backToLogin=« Back to sign in

identity-provider-login-label=Or continue with
termsTitle=Terms and conditions
