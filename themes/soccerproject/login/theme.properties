# SoccerProject login theme — Keycloak 26.7.x
#
# Extends keycloak.v2, the PatternFly v5 login theme that is the default in
# Keycloak 26. No FreeMarker template is overridden: this theme only adds a
# stylesheet, images, fonts and message overrides, so Keycloak upgrades cannot
# break it.

parent=keycloak.v2
import=common/keycloak

# The parent stylesheet stays in the chain (resource lookup falls back to the
# parent theme when a file is not present here); soccerproject.css is layered
# on top of it and must stay last.
styles=css/styles.css css/soccerproject.css

# Automatic light/dark switching following the OS preference, like the frontend
# shell. Keycloak adds kcDarkModeClass (pf-v5-theme-dark) on <html>.
darkMode=true

# Follows the light/dark choice the manager made in the frontend, which is
# published as the sp_theme cookie on the shared domain; falls back to the OS
# preference when that cookie is absent.
scripts=js/theme-mode.js

# The application ships English and Dutch, so the login locale picker matches.
locales=en,nl
