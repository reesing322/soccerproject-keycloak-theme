## SoccerProject.com — Keycloak "login" theme
## TARGET: Keycloak 26.7.1 (Quarkus distribution)
##
## Redesigned for reesing322/soccerproject-frontend#725: the auth pages are a
## continuation of the public landing page, not a separate application. The
## design tokens are the landing page's own pinned palette — see the header of
## resources/css/sp-login.v7.css for the exact source files.
##
## Inherits the base login theme so every inherited page, message bundle and
## form helper stays available, then overrides template.ftl, login.ftl and
## register.ftl. The custom template deliberately does NOT pull in the base
## PatternFly CSS — the page is styled purely by us.

parent=keycloak
import=common/keycloak

# Stylesheet(s) injected into <head>, in order. The filename carries a version
# suffix purely for cache-busting: Keycloak's resource URL doesn't change when
# CSS *content* changes, and resources are sent with a 30-day cache header, so
# a content-only edit stays cached. Bump v7 -> v8 (rename file + this line)
# whenever you change the CSS and need it to propagate immediately.
styles=css/sp-login.v7.css

# Where the masthead logo links back to. Point it at the environment's own
# front end so "back out of the login" lands on the landing page the visitor
# came from, not on keycloak.org (the base theme's default).
kcLogoLink=https://www.soccerproject.com

# Languages offered by the picker.
#
# Cut to en,nl for now (frontend#735): the application itself ships only English
# and Dutch (`src/i18n/locales.ts`), so picking one of the other 28 signed a
# manager in to auth pages in their language and then dropped them into an
# English app. The auth pages are not the place to advertise a translation the
# product does not have yet.
#
# The other 28 bundles are still in messages/ and still generated by
# tools/gen_messages.py -- nothing was thrown away. Re-enabling a language is
# two edits and no translation work:
#
#   1. add its code here
#   2. add it to `supportedLocales` on the realm
#      (soccerproject-keycloak-config/soccerproject-realm.json) -- Keycloak
#      renders the picker from the realm, so the theme alone cannot show it
#
# Every code in the full set below has a complete base bundle in Keycloak
# 26.7.1, so no page comes out half-English when one is switched back on:
#   en,nl,fr,de,es,it,pt,pt-BR,ro,cs,sk,sl,pl,hu,hr,el,no,sv,da,fi,lt,lv,tr,uk,ru,ca,id,ja,ko,zh-CN
locales=en,nl

# Environment banner. Set per deployment to label non-production instances,
# e.g. environment=staging | development | test | local. Leave blank to
# auto-detect from the hostname; set environment=production (or serve from a
# known prod host) to hide the banner entirely.
#environment=staging

################################################################################
# Keycloak class hooks -> our own semantic class names.
#
# Only login.ftl and register.ftl are forked. Every other auth page (reset
# password, update password, OTP, select-authenticator, terms, verify email,
# error, info, ...) is the base template rendering `${properties.kc*Class}`
# into its markup. Mapping those hooks onto classes sp-login.v7.css styles is
# how those pages inherit this design without a fork per page — which is the
# "use Keycloak's supported theming mechanisms" requirement in #725.
#
# The inherited values from parent=keycloak are PatternFly 3 / Bootstrap grid
# classes (`form-group`, `col-sm-12`, `btn btn-primary`, ...). None of that CSS
# is loaded here, so anything left unmapped renders as an unstyled element —
# every hook the KC 26.7.1 base templates reference is therefore listed, and
# the purely-structural ones are mapped to a class that resets to a plain
# block (.kc-form, .kc-content-wrap, ...) rather than left to inherit.
################################################################################

# ---- page scaffolding (our template.ftl owns the real shell) ----
kcHtmlClass=sp-html
kcBodyClass=sp-login-body
kcLoginClass=kc-login
kcHeaderClass=kc-header
kcHeaderWrapperClass=kc-header-wrap
kcContentWrapperClass=kc-content-wrap
kcFormCardClass=kc-form-card
kcInfoAreaWrapperClass=kc-info-wrap
kcMarginTopClass=kc-mt
kcSignUpClass=kc-signup

# ---- forms ----
kcFormClass=kc-form
kcFormGroupClass=kc-field
kcFormSettingClass=kc-form-setting
kcLabelWrapperClass=kc-label-wrap
kcLabelClass=kc-label
kcInputWrapperClass=kc-input-wrap
kcInputGroup=sp-input-wrap
kcInputClass=kc-input
kcTextareaClass=kc-textarea
kcInputErrorMessageClass=kc-field-error
kcInputHelperTextBeforeClass=kc-helper-before
kcInputHelperTextAfterClass=kc-helper-after
kcFormOptionsClass=kc-form-options
kcFormOptionsWrapperClass=kc-form-options-wrap
kcFormButtonsClass=kc-form-buttons
kcFormButtonsWrapperClass=kc-form-buttons-wrap

# ---- checkboxes / radios (user-profile driven fields) ----
kcCheckboxInputClass=kc-checkbox-input
kcCheckInputClass=kc-check-input
kcInputClassCheckbox=kc-checkbox-group
kcInputClassCheckboxInput=kc-checkbox-input
kcInputClassCheckboxLabel=kc-checkbox-label
kcInputClassRadio=kc-radio
kcInputClassRadioInput=kc-radio-input
kcInputClassRadioLabel=kc-radio-label
kcInputClassRadioCheckboxLabelDisabled=kc-label-disabled

# ---- buttons ----
# The gold pill is the primary action, exactly as on the landing page; the
# secondary/default button is outlined so a page with two buttons still has
# only one thing that looks like the way forward.
kcButtonClass=sp-btn
kcButtonPrimaryClass=sp-btn--primary
kcButtonSecondaryClass=sp-btn--secondary
kcButtonDefaultClass=sp-btn--secondary
kcButtonBlockClass=sp-btn--block
# The landing page has one control height, so there is no "large" variant to
# map onto — left empty rather than pointed at a class that does not exist.
kcButtonLargeClass=

# ---- password reveal (base pages + base/login/resources/js/passwordVisibility.js) ----
# That script swaps these two class names on an <i> inside the button. No icon
# font is loaded here, so they are CSS-masked SVGs (see .sp-eye-icon).
kcFormPasswordVisibilityButtonClass=sp-eye
kcFormPasswordVisibilityIconShow=sp-eye-icon sp-eye-icon--show
kcFormPasswordVisibilityIconHide=sp-eye-icon sp-eye-icon--hide

# ---- alerts ----
kcAlertClass=kc-alert
kcAlertTitleClass=kc-alert-title
# Feedback icons are PatternFly glyph classes upstream. Our own template draws
# inline SVGs for the alert it renders; on inherited pages the icon is simply
# absent rather than a broken glyph box.
kcFeedbackErrorIcon=
kcFeedbackWarningIcon=
kcFeedbackSuccessIcon=
kcFeedbackInfoIcon=
kcResetFlowIcon=

# ---- identity providers ----
kcFormSocialAccountSectionClass=kc-social-section
kcFormSocialAccountListClass=kc-social-list
kcFormSocialAccountListGridClass=kc-social-list--grid
kcFormSocialAccountGridItem=kc-social-grid-item
kcFormSocialAccountListButtonClass=kc-social-button
kcFormSocialAccountListButtonDisabledClass=kc-social-button--disabled
kcFormSocialAccountNameClass=sp-social__name
kcCommonLogoIdP=sp-social__icon

# ---- locale picker on inherited pages ----
kcLocaleWrapperClass=kc-locale
kcLocaleMainClass=kc-locale-main
kcLocaleDropDownClass=kc-locale-dropdown
kcLocaleListClass=kc-locale-list
kcLocaleListItemClass=kc-locale-item
kcLocaleItemClass=kc-locale-item

# ---- select-authenticator ----
kcSelectAuthListClass=kc-select-auth-list
kcSelectAuthListItemClass=kc-select-auth-item
kcSelectAuthListItemHeadingClass=kc-select-auth-heading
kcSelectAuthListItemTitle=kc-select-auth-heading
kcSelectAuthListItemBodyClass=kc-select-auth-body
kcSelectAuthListItemDescriptionClass=kc-select-auth-desc
kcSelectAuthListItemFillClass=kc-select-auth-fill
kcSelectAuthListItemIconClass=kc-select-auth-icon
kcSelectAuthListItemIconPropertyClass=kc-select-auth-icon-prop
kcSelectAuthListItemArrowClass=kc-select-auth-arrow
kcSelectAuthListItemArrowIconClass=kc-select-auth-arrow-icon

# ---- OTP credential list ----
kcLoginOTPListClass=kc-otp-list
kcLoginOTPListInputClass=kc-otp-input
kcLoginOTPListItemHeaderClass=kc-otp-item
kcLoginOTPListItemIconBodyClass=kc-otp-item-icon-body
kcLoginOTPListItemIconClass=kc-otp-item-icon
kcLoginOTPListItemTitleClass=kc-otp-item-title

# ---- recovery codes ----
kcRecoveryCodesList=kc-recovery-list
kcRecoveryCodesActions=kc-recovery-actions
kcRecoveryCodesWarning=kc-recovery-warning

# ---- WebAuthn ----
kcWebAuthnKeyIcon=kc-webauthn-icon
kcWebAuthnDefaultIcon=kc-webauthn-icon
